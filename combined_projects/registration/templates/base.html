<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Voter Registration System{% endblock %}</title>
    <style>
        * { margin: 0; padding:0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem;
        }
        .container { 
            background: white; 
            padding: 2rem; 
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
        }
        h1 { 
            text-align: center; 
            margin-bottom: 2rem; 
            color: #333;
            font-size: 2rem;
        }
        .form-group { 
            margin-bottom: 1.5rem; 
        }
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            font-weight: 600;
            color: #555;
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus { 
            outline: none; 
            border-color: #667eea; 
        }
        .btn { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            padding: 12px 30px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
            width: 100%;
        }
        .btn:hover { 
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #6c757d;
            margin-top: 1rem;
        }
        .alert { 
            padding: 12px; 
            margin-bottom: 1rem; 
            border-radius: 8px; 
        }
        .alert-success { 
            background-color: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb;
        }
        .alert-error { 
            background-color: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb;
        }
        .nav-links {
            text-align: center;
            margin-top: 2rem;
        }
        .nav-links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 1rem;
            font-weight: 500;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        .voters-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .voters-table th, .voters-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .voters-table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        .file-input-label {
            display: block;
            padding: 12px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .file-input-label:hover {
            border-color: #667eea;
        }

        /* Arduino Control Styles */
        .arduino-control {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .arduino-control h4 {
            margin: 0 0 10px 0;
            color: #495057;
            font-size: 16px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        
        .status-connected { background-color: #28a745; }
        .status-disconnected { background-color: #dc3545; }
        
        .arduino-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin: 2px;
            transition: all 0.3s;
        }
        
        .arduino-btn:hover { background-color: #218838; }
        .arduino-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        
        .check-btn { background-color: #007bff; }
        .check-btn:hover { background-color: #0056b3; }
        
        .arduino-status-text {
            font-size: 12px;
            margin: 5px 0;
        }
        
        .arduino-message {
            padding: 8px;
            border-radius: 4px;
            margin: 8px 0;
            font-size: 12px;
            display: none;
        }
        
        .arduino-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .arduino-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .arduino-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'error' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
        <!-- Arduino Control Panel -->
        <div class="arduino-control">
            <h4>🔌 Arduino Connection</h4>
            <div id="connectionStatus" class="arduino-status-text">
                <span id="statusIndicator" class="status-indicator status-disconnected"></span>
                <span id="statusText">Checking connection...</span>
            </div>
            <div style="margin-top: 8px;">
                <button id="checkStatusBtn" class="arduino-btn check-btn" onclick="checkArduinoStatus()">
                    📡 Check
                </button>
                <button id="reconnectBtn" class="arduino-btn" onclick="reconnectArduino()">
                    🔄 Reconnect
                </button>
                <span style="font-size: 11px; color: #6c757d; margin-left: 10px;">
                    Use if fingerprint functions fail
                </span>
            </div>
            <div id="arduinoMessage" class="arduino-message"></div>
        </div>
    </div>

    <script>
        // Arduino Control Functions
        function showArduinoMessage(message, type) {
            const messageDiv = document.getElementById('arduinoMessage');
            messageDiv.textContent = message;
            messageDiv.className = `arduino-message arduino-${type}`;
            messageDiv.style.display = 'block';
            
            // Hide message after 4 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 4000);
        }

        function updateConnectionStatus(connected, message) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                indicator.className = 'status-indicator status-connected';
                statusText.textContent = '✅ Connected';
            } else {
                indicator.className = 'status-indicator status-disconnected';
                statusText.textContent = '❌ Disconnected';
            }
        }

        function checkArduinoStatus() {
            const btn = document.getElementById('checkStatusBtn');
            btn.disabled = true;
            btn.textContent = '🔍 Checking...';
            
            fetch('/arduino-status')
                .then(response => response.json())
                .then(data => {
                    updateConnectionStatus(data.connected, data.message);
                    showArduinoMessage(data.message, data.connected ? 'success' : 'error');
                })
                .catch(error => {
                    updateConnectionStatus(false, 'Error checking status');
                    showArduinoMessage('Error checking Arduino status: ' + error.message, 'error');
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = '📡 Check';
                });
        }

        function reconnectArduino() {
            const btn = document.getElementById('reconnectBtn');
            btn.disabled = true;
            btn.textContent = '🔄 Connecting...';
            
            showArduinoMessage('Attempting to reconnect Arduino...', 'info');
            
            fetch('/arduino-reconnect', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateConnectionStatus(true, data.message);
                    showArduinoMessage(data.message, 'success');
                } else {
                    updateConnectionStatus(false, data.message);
                    showArduinoMessage(data.message, 'error');
                }
                
                // Auto-check status after reconnect attempt
                setTimeout(checkArduinoStatus, 1000);
            })
            .catch(error => {
                updateConnectionStatus(false, 'Reconnection failed');
                showArduinoMessage('Error reconnecting Arduino: ' + error.message, 'error');
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = '🔄 Reconnect';
            });
        }

        // Check Arduino status on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkArduinoStatus();
            
            // File input preview (existing functionality)
            const fileInput = document.getElementById('photo');
            const fileLabel = document.querySelector('.file-input-label');
            
            if (fileInput && fileLabel) {
                fileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        fileLabel.innerHTML = `📷 Selected: ${file.name}<br><small>Click to change photo</small>`;
                        fileLabel.style.borderColor = '#667eea';
                        fileLabel.style.backgroundColor = '#f8f9ff';
                    }
                });
            }
        });

        // Auto-refresh Arduino status every 60 seconds
        setInterval(checkArduinoStatus, 60000);
    </script>
</body>
</html>
