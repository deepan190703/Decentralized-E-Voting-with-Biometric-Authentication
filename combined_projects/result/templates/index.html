<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Voting Results</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .update-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            backdrop-filter: blur(10px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chart-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        .results-table {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .table-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
        }

        .table-header h3 {
            font-size: 1.5rem;
            text-align: center;
        }

        .candidate-row {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
            transition: all 0.3s ease;
        }

        .candidate-row:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateX(5px);
        }

        .candidate-rank {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 20px;
        }

        .candidate-image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .candidate-info {
            flex: 1;
            margin-right: 20px;
        }

        .candidate-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .candidate-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-right: 10px;
        }

        .party-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .candidate-party {
            color: #666;
            font-size: 0.9rem;
        }

        .vote-stats {
            text-align: right;
            min-width: 150px;
        }

        .vote-count {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
        }

        .vote-percentage {
            color: #666;
            font-size: 0.9rem;
        }

        .balance-info {
            color: #888;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .candidate-row {
                flex-direction: column;
                text-align: center;
            }

            .candidate-rank {
                margin-bottom: 10px;
            }

            .candidate-image {
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🗳️ Live Voting Results</h1>
            <div class="update-info">
                <span id="lastUpdate">Loading...</span> | Updates every 30 seconds
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalVotes">0</div>
                <div class="stat-label">Total Votes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCandidates">0</div>
                <div class="stat-label">Candidates</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="leadingCandidate">-</div>
                <div class="stat-label">Leading</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">📊 Vote Distribution</div>
                <canvas id="pieChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">📈 Vote Comparison</div>
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <div class="results-table">
            <div class="table-header">
                <h3>📋 Detailed Results</h3>
            </div>
            <div id="candidatesList">
                <div class="loading">Loading voting data...</div>
            </div>
        </div>
    </div>

    <script>
        let pieChart, barChart;

        // Initialize charts
        function initCharts() {
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            const barCtx = document.getElementById('barChart').getContext('2d');

            pieChart = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [
                            '#FF6384',
                            '#36A2EB',
                            '#FFCE56',
                            '#4BC0C0',
                            '#9966FF',
                            '#FF9F40'
                        ],
                        borderWidth: 3,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true
                            }
                        }
                    }
                }
            });

            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Votes',
                        data: [],
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        // Fetch and update voting data
        async function updateVotingData() {
            try {
                const response = await fetch('/api/voting-data');
                const data = await response.json();

                // Update statistics
                document.getElementById('totalVotes').textContent = data.total_votes.toLocaleString();
                document.getElementById('totalCandidates').textContent = data.candidates.length;
                document.getElementById('leadingCandidate').textContent = data.candidates[0]?.name || '-';
                document.getElementById('lastUpdate').textContent = `Last updated: ${data.last_update}`;

                // Update charts
                updateCharts(data.candidates);

                // Update candidates list
                updateCandidatesList(data.candidates);

            } catch (error) {
                console.error('Error fetching voting data:', error);
            }
        }

        // Update chart data
        function updateCharts(candidates) {
            const names = candidates.map(c => c.name);
            const votes = candidates.map(c => c.votes);

            // Update pie chart
            pieChart.data.labels = names;
            pieChart.data.datasets[0].data = votes;
            pieChart.update('none');

            // Update bar chart
            barChart.data.labels = names;
            barChart.data.datasets[0].data = votes;
            barChart.update('none');
        }

        // Update candidates list
        function updateCandidatesList(candidates) {
            const container = document.getElementById('candidatesList');
            container.innerHTML = '';

            candidates.forEach((candidate, index) => {
                const row = document.createElement('div');
                row.className = 'candidate-row';

                row.innerHTML = `
                    <div class="candidate-rank">${index + 1}</div>
                    <img class="candidate-image" src="data:image/jpeg;base64,${candidate.image_base64}" alt="${candidate.name}" onerror="this.style.display='none'">
                    <div class="candidate-info">
                        <div class="candidate-header">
                            <div class="candidate-name">${candidate.name}</div>
                            <img class="party-logo" src="data:image/png;base64,${candidate.logo_base64}" alt="${candidate.party}" onerror="this.style.display='none'">
                        </div>
                        <div class="candidate-party">${candidate.party}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${candidate.percentage}%"></div>
                        </div>
                    </div>
                    <div class="vote-stats">
                        <div class="vote-count">${candidate.votes.toLocaleString()}</div>
                        <div class="vote-percentage">${candidate.percentage}%</div>
                        <div class="balance-info">Balance: ${candidate.balance.toFixed(4)}</div>
                    </div>
                `;

                container.appendChild(row);
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', function () {
            initCharts();
            updateVotingData();

            // Set up auto-refresh every 30 seconds
            setInterval(updateVotingData, 30000);
        });
    </script>
</body>

</html>
