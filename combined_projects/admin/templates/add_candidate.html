<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Candidate - Voting System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>➕ Add Candidate</h1>
        <p style="font-size: 1.2rem; color: rgba(255, 255, 255, 0.9); font-weight: 300; margin-bottom: 40px;">Register a new candidate for the election</p>

        {% if message %}
            <div class="success-message">
                ✅ {{ message }}
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            <h2>Candidate Information</h2>
            
            <div class="form-group">
                <label for="name">Candidate Name</label>
                <input type="text" name="name" placeholder="Enter candidate's full name" required>
            </div>
            
            <div class="form-group">
                <label for="party">Party Name</label>
                <input type="text" name="party" placeholder="Enter party name" required>
            </div>

            <div class="form-group">
                <label for="image">Candidate Photo</label>
                <input type="file" name="image" accept="image/*" required>
            </div>

            <div class="form-group">
                <label for="logo">Party Logo</label>
                <input type="file" name="logo" accept="image/*" required>
            </div>

            <button type="submit">➕ Add Candidate</button>
        </form>

        <div style="margin-top: 30px;">
            <a href="/dashboard"><button>⬅ Back to Dashboard</button></a>
            <a href="/view_candidates"><button>📋 View Candidates</button></a>
        </div>
    </div>

    <script>
        // Add interactive enhancements
        document.addEventListener('DOMContentLoaded', function() {
            // Add ripple effect to buttons
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.classList.add('ripple');
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });

            // Form validation feedback
            const inputs = document.querySelectorAll('input[required]');
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    if (this.value.trim() === '') {
                        this.style.borderColor = '#e53e3e';
                    } else {
                        this.style.borderColor = '#48bb78';
                    }
                });
            });

            // File input preview (optional enhancement)
            const fileInputs = document.querySelectorAll('input[type="file"]');
            fileInputs.forEach(input => {
                input.addEventListener('change', function() {
                    if (this.files && this.files[0]) {
                        this.style.borderColor = '#48bb78';
                    }
                });
            });
        });
    </script>
</body>
</html>
