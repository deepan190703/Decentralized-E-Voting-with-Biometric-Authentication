<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Candidates - Voting System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📋 Candidates</h1>
        <p style="font-size: 1.2rem; color: rgba(255, 255, 255, 0.9); font-weight: 300; margin-bottom: 40px;">Registered candidates for the election</p>
        
        <div class="candidates-container">
            {% for c in candidates %}
            <div class="candidate-card">
                <h3>{{ c['name'] }}</h3>
                <p><strong>{{ c['party'] }}</strong></p>
                
                <div style="margin: 20px 0;">
                    <img src="data:image/png;base64,{{ c['image'] }}" alt="Candidate Photo">
                    <img src="data:image/png;base64,{{ c['logo'] }}" alt="Party Logo">
                </div>
                
                <div class="public-key">
                    <strong>Public Key:</strong><br>
                    {{ c['public_key'][:40] }}...
                </div>
            </div>
            {% endfor %}
        </div>

        <div style="margin-top: 40px;">
            <a href="/dashboard"><button>⬅ Back to Dashboard</button></a>
        </div>
    </div>

    <script>
        // Add interactive enhancements
        document.addEventListener('DOMContentLoaded', function() {
            // Add ripple effect to buttons
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.classList.add('ripple');
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });

            // Add hover effects to candidate cards
            const candidateCards = document.querySelectorAll('.candidate-card');
            candidateCards.forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-8px) scale(1.02)';
                });
                
                card.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
        });
    </script>
</body>
</html>
